name: Validate website
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-22.04
    env:
      HOMES_BUILD_PROFILE: local
      HOMES_E2E: '1'
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:9/api/v1
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chrome
      - run: npm run test:e2e
      - name: Build against isolated visual QA inventory
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:3100/api/v1
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3101
        run: |
          node e2e/fixtures/server.mjs &
          fixture_pid=$!
          trap 'kill "$fixture_pid"' EXIT
          node --input-type=module -e 'for(let i=0;i<40;i++){try{await fetch("http://127.0.0.1:3100/api/v1/properties");break}catch{if(i===39)throw new Error("Fixture API did not start");await new Promise(r=>setTimeout(r,250))}}'
          npm run build
      - name: Check responsive design and preserved consumer flows
        run: npx playwright test --config playwright.visual.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homes-v2-visual-qa
          path: test-results/v2-screenshots
  consumer-accounts:
    runs-on: ubuntu-22.04
    env:
      HOMES_BUILD_PROFILE: local
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:3100/api/v1
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3101
    steps:
      - uses: actions/checkout@v4
        with:
          path: dnbhomeswebsite
      - uses: actions/checkout@v4
        with:
          repository: DouglasBagambe/dnbhomesbackend
          ref: 02cd183bc89e52f3ae63c382bae6a923322487d3
          path: dnbhomesbackend
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: |
            dnbhomeswebsite/package-lock.json
            dnbhomesbackend/package-lock.json
      - run: npm ci
        working-directory: dnbhomesbackend
      - run: npm ci
        working-directory: dnbhomeswebsite
      - run: npm run build
        working-directory: dnbhomeswebsite
      - run: npx playwright install --with-deps chrome
        working-directory: dnbhomeswebsite
      - name: Verify real ownership, private sessions and cross-device state
        run: npx playwright test --config playwright.accounts.config.ts
        working-directory: dnbhomeswebsite
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: homes-account-qa
          path: dnbhomeswebsite/test-results
